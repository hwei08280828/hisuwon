<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수원화성 탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F1;--surface:#FFFFFF;--ink:#1E2B33;--muted:#5A6870;--line:#D9DED6;--teal:#2B6B63;--ochre:#B8862E;--red:#B4432F;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{--bg:#141B1E;--surface:#1D262A;--ink:#E8ECE6;--muted:#A3AEA9;--line:#2E3A3F;--teal:#7DBCB1;--ochre:#D9AE5C;--red:#E07A63;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);word-break:keep-all;font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.65}
main{max-width:560px;margin:0 auto;padding:32px 22px 48px}
h1,h2{font-family:"Gowun Batang","Nanum Myeongjo",serif;line-height:1.3;margin:0}
h1{font-size:2.1rem}
.lead{color:var(--muted);margin:8px 0 26px}
a.item{display:block;padding:18px 20px;margin-top:12px;border-radius:14px;background:var(--surface);border-left:6px solid var(--teal);color:inherit;text-decoration:none}
a.item:nth-of-type(2){border-left-color:var(--red)}
a.item:nth-of-type(3){border-left-color:var(--ochre)}
a.item:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
a.item h2{font-size:1.3rem}
a.item p{margin:4px 0 0;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>수원화성 탐험</h1>
  <p class="lead">하고 싶은 활동을 골라 보세요.</p>
  <a class="item" href="hwaseong-ar.html"><h2>AR로 화성 살펴보기</h2><p>마커 카드를 카메라로 비추면 건물이 나타나요.</p></a>
  <a class="item" href="geojunggi.html"><h2>거중기로 성돌 들어 올리기</h2><p>도르래 수를 바꿔 가며 무거운 돌을 올려 봐요.</p></a>
  <a class="item" href="haenggung.html"><h2>화성행궁 탐험 카드</h2><p>행궁 11곳의 이야기를 읽어 봐요.</p></a>
</main>
</body>
</html>
