<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>화성행궁 탐험 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --ink:#1E2B33; --muted:#5A6870;
  --teal:#2B6B63; --ochre:#B8862E; --red:#B4432F; --line:#D9DED6;
  --story:#EEF4F2; --think:#FBF4E6;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141B1E; --surface:#1D262A; --ink:#E8ECE6; --muted:#A3AEA9;
    --teal:#7DBCB1; --ochre:#D9AE5C; --red:#E07A63; --line:#2E3A3F;
    --story:#1C2B2A; --think:#2A2519;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141B1E; --surface:#1D262A; --ink:#E8ECE6; --muted:#A3AEA9;
  --teal:#7DBCB1; --ochre:#D9AE5C; --red:#E07A63; --line:#2E3A3F;
  --story:#1C2B2A; --think:#2A2519;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:18px;line-height:1.75;word-break:keep-all;}
main{max-width:620px;margin:0 auto;padding:28px 22px 56px}
h1,h2,h3{font-family:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;line-height:1.3;margin:0}
.roof{display:block;width:100%;height:auto;color:var(--teal);margin-bottom:10px}
.hero h1{font-size:2rem}
.hero p{color:var(--muted);margin:10px 0 0}
.route{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--line)}
.route a{display:flex;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);
  color:inherit;text-decoration:none}
.route a:focus-visible,.btn:focus-visible{outline:3px solid var(--ochre);outline-offset:2px;border-radius:6px}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;
  display:grid;place-items:center;font-family:"Gowun Batang",serif;font-weight:700;font-size:1.15rem}
.route strong{display:block;font-family:"Gowun Batang",serif;font-size:1.15rem}
.route span.sub{display:block;color:var(--muted);font-size:.95rem;line-height:1.5}
.note{margin-top:28px;color:var(--muted);font-size:.95rem}

.area{position:relative}
.area .head{position:relative;padding:18px 0 22px;border-bottom:2px solid var(--teal);overflow:hidden}
.hanja{position:absolute;right:-6px;top:-10px;font-family:"Gowun Batang",serif;font-size:6.5rem;
  line-height:1;color:var(--teal);opacity:.12;pointer-events:none;white-space:nowrap}
.area .num{width:56px;height:56px;font-size:1.5rem;margin-bottom:14px}
.area h1{font-size:2.3rem;position:relative}
.area .what{color:var(--muted);margin-top:6px;position:relative}
.area h2{font-size:1.2rem;color:var(--teal);margin:28px 0 6px}
.area p{margin:0}
.box{border-radius:14px;padding:16px 18px;margin-top:24px}
.box h2{margin:0 0 6px}
.story{background:var(--story)}
.think{background:var(--think)}
.think h2{color:var(--ochre)}
nav.pager{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.btn{flex:1 1 30%;min-width:96px;text-align:center;padding:12px 10px;border-radius:12px;border:1.5px solid var(--teal);
  color:var(--teal);text-decoration:none;font-weight:700;background:var(--surface)}
.btn.main{background:var(--teal);color:var(--bg)}
.btn[aria-disabled="true"]{visibility:hidden}
@media (prefers-reduced-motion:no-preference){
  .area .head{animation:rise .5s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<main id="app"></main>
<script>
const AREAS = [
 {slug:"sinpungru", name:"신풍루", hanja:"新豐樓", what:"화성행궁의 정문",
  about:"행궁에 들어가는 첫 번째 문이에요. 2층 누각이 있어서 멀리서도 잘 보여요. 이름에는 정조가 수원을 고향처럼 아끼겠다는 마음이 담겨 있어요.",
  story:"1795년 정조는 이 문 앞에서 수원의 어려운 백성들에게 쌀과 죽을 나누어 주었어요.",
  think:"왕이 정문 앞에서 백성에게 직접 쌀을 나누어 준 까닭은 무엇일까요?"},
 {slug:"jwaikmun", name:"좌익문", hanja:"左翊門", what:"행궁의 두 번째 문(중문)",
  about:"신풍루를 지나면 나오는 두 번째 문이에요. 바깥 공간과 행궁 안쪽 공간을 나누는 역할을 했어요.",
  story:"행궁은 한양의 궁궐처럼 문을 여러 번 지나야 왕이 있는 곳에 닿도록 지어졌어요.",
  think:"왕이 있는 곳까지 문을 여러 개 지나게 만든 이유는 무엇일까요?"},
 {slug:"jungyangmun", name:"중양문", hanja:"中陽門", what:"봉수당 앞의 세 번째 문",
  about:"행궁의 가장 중요한 건물인 봉수당 바로 앞에 있는 문이에요. 이 문을 지나면 왕과 왕실 가족의 공간이 시작돼요.",
  story:"신풍루, 좌익문, 중양문 세 문이 한 줄로 이어져 있어 행궁의 중심 길을 만들어요.",
  think:"세 문을 차례로 지나며 걸으면 어떤 느낌이 들까요?"},
 {slug:"bongsudang", name:"봉수당", hanja:"奉壽堂", what:"행궁의 으뜸 건물(정전)",
  about:"행궁에서 가장 중요한 건물이에요. 왕이 머물 때 나랏일을 보던 곳이에요. 이름은 '오래 사시기를 받든다'는 뜻이에요.",
  story:"1795년 정조는 이곳에서 어머니 혜경궁 홍씨의 회갑(61세) 잔치를 크게 열었어요.",
  think:"정조는 왜 어머니의 잔치를 한양이 아닌 수원에서 열었을까요?"},
 {slug:"jangnakdang", name:"장락당", hanja:"長樂堂", what:"혜경궁 홍씨가 머문 곳",
  about:"봉수당 옆에 붙어 있는 건물로, 정조의 어머니 혜경궁 홍씨가 머물던 곳이에요. 이름은 '길이 즐거움을 누린다'는 뜻이에요.",
  story:"정조는 어머니가 편히 지내시도록 행궁 안에 따로 머물 곳을 마련했어요.",
  think:"건물 이름에 담긴 정조의 마음은 어떤 마음일까요?"},
 {slug:"boknaedang", name:"복내당", hanja:"福內堂", what:"행궁의 안채",
  about:"행궁에서 생활하는 사람들이 머물던 안쪽 살림 공간이에요. 바깥의 큰 건물들보다 조용하고 아늑하게 지어졌어요.",
  story:"행궁에는 나랏일을 보는 공간과 쉬고 생활하는 공간이 나뉘어 있었어요.",
  think:"일하는 공간과 생활하는 공간을 나눈 이유는 무엇일까요?"},
 {slug:"yuyeotaek", name:"유여택", hanja:"維與宅", what:"정조가 신하를 만나던 곳",
  about:"정조가 행궁에 머물 때 신하들을 만나거나 쉬던 건물이에요. 평소에는 수원을 다스리던 관리가 일하는 곳으로 쓰였어요.",
  story:"왕이 오지 않을 때에도 행궁은 비어 있지 않고 고을을 다스리는 관청 역할을 했어요.",
  think:"왕이 없을 때도 행궁을 관청으로 쓴 것은 어떤 점에서 좋았을까요?"},
 {slug:"naknamheon", name:"낙남헌", hanja:"洛南軒", what:"잔치와 시험이 열린 곳",
  about:"벽을 줄여 시원하게 트인 건물이에요. 큰 행사를 열기에 알맞게 지어졌어요. 일제강점기에도 헐리지 않고 남은 몇 안 되는 건물이에요.",
  story:"1795년 정조는 이곳에서 수원의 노인들을 모아 잔치(양로연)를 베풀고, 특별 과거 시험의 합격자를 발표했어요.",
  think:"정조가 노인들을 위한 잔치를 연 까닭은 무엇일까요?"},
 {slug:"noraedang", name:"노래당", hanja:"老來堂", what:"정조가 노후를 꿈꾼 곳",
  about:"낙남헌 옆의 작은 건물이에요. 이름은 '늙어서 온다'는 뜻이에요.",
  story:"정조는 왕위를 물려준 뒤 수원에 내려와 쉬고 싶다는 마음을 이 이름에 담았다고 해요.",
  think:"정조에게 수원은 어떤 의미가 있는 곳이었을까요?"},
 {slug:"deukjungjeong", name:"득중정", hanja:"得中亭", what:"활쏘기를 하던 정자",
  about:"정조가 활을 쏘던 정자예요. 정조는 활을 아주 잘 쏘는 왕으로 유명했어요.",
  story:"이름은 '쏘아서 가운데를 맞혔다'는 뜻으로, 정조가 활을 쏘아 과녁을 맞힌 일에서 왔다고 해요.",
  think:"왕이 활쏘기를 꾸준히 연습한 것은 나라를 지키는 일과 어떤 관계가 있을까요?"},
 {slug:"hwaryeongjeon", name:"화령전", hanja:"華寧殿", what:"정조의 초상화를 모신 곳",
  about:"행궁 바로 옆에 있는 건물로, 정조가 세상을 떠난 뒤 그의 초상화(어진)를 모시려고 지었어요.",
  story:"정조의 아들 순조가 아버지를 기리며 이곳을 지었어요.",
  think:"순조가 아버지 정조를 수원에서 기린 까닭은 무엇일까요?"}
];

const roof = `<svg class="roof" viewBox="0 0 400 60" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
<path d="M8 44 C70 40 120 22 200 20 C280 22 330 40 392 44"/>
<path d="M30 52 C90 48 140 34 200 32 C260 34 310 48 370 52" opacity=".55"/>
<path d="M2 38 C6 44 10 46 16 45 M398 38 C394 44 390 46 384 45"/></svg>`;

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

function home(){
  document.title = "화성행궁 탐험 카드";
  return `<header class="hero">${roof}<h1>화성행궁 탐험 카드</h1>
  <p>카드의 QR을 찍으면 그 장소의 설명이 열려요. 아래 번호를 눌러서 볼 수도 있어요.</p></header>
  <ol class="route">${AREAS.map((a,i)=>`<li><a href="#${i+1}"><span class="num">${i+1}</span>
  <span><strong>${a.name}</strong><span class="sub">${a.what}</span></span></a></li>`).join("")}</ol>
  <p class="note">번호는 정문에서 안쪽으로 걸어 들어가는 순서예요. 화성행궁은 일제강점기에 대부분 헐렸다가, 1990년대부터 옛 기록을 바탕으로 다시 지어졌어요.</p>`;
}

function area(i){
  const a = AREAS[i];
  document.title = `${i+1}. ${a.name} | 화성행궁 탐험 카드`;
  const prev = i>0 ? `href="#${i}"` : `aria-disabled="true"`;
  const next = i<AREAS.length-1 ? `href="#${i+2}"` : `aria-disabled="true"`;
  return `<article class="area"><div class="head"><span class="hanja" aria-hidden="true">${a.hanja}</span>
  <span class="num">${i+1}</span><h1>${a.name}</h1><p class="what">${a.what} · ${a.hanja}</p></div>
  <h2>어떤 곳일까?</h2><p>${esc(a.about)}</p>
  <section class="box story"><h2>이야기 한 토막</h2><p>${esc(a.story)}</p></section>
  <section class="box think"><h2>생각해 보기</h2><p>${esc(a.think)}</p></section>
  <nav class="pager"><a class="btn" ${prev}>이전 장소</a><a class="btn main" href="#">전체 목록</a><a class="btn" ${next}>다음 장소</a></nav>
  </article>`;
}

function route(){
  const h = decodeURIComponent(location.hash.replace("#",""));
  let i = -1;
  if(/^\d+$/.test(h)) i = parseInt(h,10)-1;
  else i = AREAS.findIndex(a=>a.slug===h);
  document.getElementById("app").innerHTML = (i>=0 && i<AREAS.length) ? area(i) : home();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
